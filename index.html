<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HimArc</title>

<style>
body{
background:#071233;
font-family:Arial,sans-serif;
color:white;
text-align:center;
padding:20px;
}

h1{
font-size:48px;
}

.card{
background:#1c2948;
padding:25px;
margin:20px auto;
max-width:700px;
border-radius:20px;
}

button{
background:#3b63f0;
color:white;
border:none;
padding:15px 25px;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

input{
padding:12px;
width:80%;
border-radius:10px;
border:none;
margin:10px;
}

a{
display:block;
background:#3b63f0;
color:white;
text-decoration:none;
padding:12px;
margin:10px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>🚀 HimArc</h1>

<div class="card">
<h2>ARC Testnet DEX</h2>
<p>Build. Learn. Swap.</p>

<button onclick="connectWallet()">Connect Wallet</button>

<p id="wallet">Wallet: Not Connected</p>
</div>

<div class="card">
<h2>👤 User Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<br>

<button onclick="login()">Login</button>

<p id="user"></p>
</div>

<div class="card">
<h2>🏆 Dashboard</h2>

<p id="xp">XP: 400</p>

<p id="level">Level: 1</p>

<button onclick="addXP()">Complete Quest</button>
</div>

<div class="card">
<h2>🌐 ARC Ecosystem</h2>

<a href="https://community.arc.io/home" target="_blank">
ARC Community Hub
</a>

<a href="https://app.onmi.fun/swap?chain=ARC_TESTNET" target="_blank">
Omni Swap
</a>

<a href="https://faucet.circle.com/" target="_blank">
Circle Faucet
</a>

<a href="https://docs.arc.network/" target="_blank">
ARC Docs
</a>

<a href="https://x.com/arc" target="_blank">
ARC X
</a>
</div>

<script>

let xp = localStorage.getItem("xp") || 400;

updateXP();

function addXP(){

xp = parseInt(xp) + 100;

localStorage.setItem("xp",xp);

updateXP();
}

function updateXP(){

document.getElementById("xp").innerText =
"XP: " + xp;

let level = Math.floor(xp/500)+1;

document.getElementById("level").innerText =
"Level: " + level;
}

function login(){

let email =
document.getElementById("email").value;

localStorage.setItem("email",email);

document.getElementById("user").innerText =
"Logged in: " + email;
}

window.onload=function(){

let savedEmail =
localStorage.getItem("email");

if(savedEmail){

document.getElementById("user").innerText =
"Logged in: " + savedEmail;
}
}

async function connectWallet(){

if(typeof window.ethereum !== "undefined"){

try{

const accounts =
await ethereum.request({
method:"eth_requestAccounts"
});

document.getElementById("wallet").innerText =
"Wallet: " + accounts[0];

}catch(err){

alert("Wallet connection cancelled");
}

}else{

alert("MetaMask not found");
}
}

</script>

</body>
</html>
