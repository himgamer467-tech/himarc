<!DOCTYPE html>
<html>
<head>
<title>HimArc</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:40px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}
button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
}
</style>
</head>
<body>

<h1> HimArc</h1>

<div class="card">
<h2>ARC Testnet DEX</h2>
<p>Build. Learn. Swap.</p>

<button onclick="connectWallet()">
Connect Wallet
</button>

<p id="wallet">Wallet: Not Connected</p>
</div>

<script>
async function connectWallet(){

if(typeof window.ethereum !== "undefined"){

try{
const accounts = await ethereum.request({
method:"eth_requestAccounts"
});

document.getElementById("wallet").innerText =
"Wallet: " + accounts[0];

}catch(err){
alert("Wallet connection cancelled");
}

}else{
alert("MetaMask not found");
}

}
</script>

</body>
</html>
